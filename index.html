<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twin Dev API | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .navbar { background-color: #1e293b; border-bottom: 1px solid #334155; }
        .card-stat { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; transition: 0.3s; }
        .card-stat:hover { border-color: #38bdf8; }
        .badge-status { background: #22c55e; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; }
        code { color: #38bdf8; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1 fw-bold">TWIN <span class="text-info">DEV</span> API</span>
        <span class="badge-status">System Online</span>
    </div>
</nav>

<div class="container">
    <div class="row g-4 mb-5 text-center">
        <div class="col-6 col-md-3">
            <div class="card-stat">
                <small class="text-secondary">Requests</small>
                <h3 id="reqCount">0</h3>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card-stat">
                <small class="text-secondary">Runtime</small>
                <h3 id="runtime">0m</h3>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card-stat">
                <small class="text-secondary">RAM</small>
                <h3 id="ramUsage">0MB</h3>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card-stat">
                <small class="text-secondary">Features</small>
                <h3>2</h3>
            </div>
        </div>
    </div>

    <h4 class="mb-3 fw-bold">Daftar Fitur (REST API)</h4>
    <div class="card-stat mb-4">
        <table class="table table-dark table-hover mb-0">
            <thead>
                <tr>
                    <th>Fitur</th>
                    <th>Method</th>
                    <th>Endpoint</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Tebak Bendera</td>
                    <td><span class="badge bg-success">GET</span></td>
                    <td><code>/api/tebak-bendera</code></td>
                    <td><a href="/api/tebak-bendera" class="btn btn-sm btn-info">Cek</a></td>
                </tr>
                <tr>
                    <td>Cek Jawaban</td>
                    <td><span class="badge bg-success">GET</span></td>
                    <td><code>/api/jawab?tebakan=...</code></td>
                    <td><button class="btn btn-sm btn-outline-info">Info</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Ambil data statistik dari API
    async function updateStats() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            document.getElementById('reqCount').innerText = data.total_requests;
            document.getElementById('runtime').innerText = data.runtime;
            document.getElementById('ramUsage').innerText = data.memory_usage;
        } catch (e) { console.log("Gagal update stats"); }
    }
    
    // Update tiap 5 detik
    setInterval(updateStats, 5000);
    updateStats();
</script>

</body>
</html>
