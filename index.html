<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twin API Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background: #1e1e1e; border: 1px solid #333; color: white; border-radius: 15px; }
        .btn-primary { background: #6f42c1; border: none; }
        .btn-primary:hover { background: #5a32a3; }
        code { color: #f8f9fa; background: #333; padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold">Twin <span class="text-primary">Dev</span> API</h1>
        <p class="lead">Pusat API Game & Tools Gratis 100%</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow">
                <h3 class="text-center">🎮 Tebak Bendera</h3>
                <div id="bendera" class="text-center my-3" style="font-size: 80px;">❓</div>
                <p id="hint" class="text-center text-secondary">Klik Ambil Soal</p>
                
                <div class="input-group mb-3">
                    <input type="text" id="jawabanInput" class="form-control bg-dark text-white border-secondary" placeholder="Jawaban...">
                    <button onclick="jawabSoal()" class="btn btn-primary">Kirim</button>
                </div>
                
                <button onclick="ambilSoal()" class="btn btn-outline-light w-100 mb-3">Ambil Soal</button>
                <div id="hasil" class="text-center fw-bold"></div>
                
                <hr class="border-secondary">
                <small class="text-secondary">Endpoint: <code>/api/tebak-bendera</code></small>
            </div>
        </div>
    </div>
</div>
    

<script>
    // Karena HTML ini satu server sama API, kita bisa pake "/" aja
    const BASE_URL = window.location.origin;

    async function ambilSoal() {
        const res = await fetch(`${BASE_URL}/api/tebak-bendera`);
        const data = await res.json();
        const emoji = data.soal.split(' ').pop();
        document.getElementById('bendera').innerText = emoji;
        document.getElementById('hint').innerText = data.hint;
        document.getElementById('hasil').innerText = "";
    }

    async function jawabSoal() {
        const jawab = document.getElementById('jawabanInput').value;
        const res = await fetch(`${BASE_URL}/api/jawab?tebakan=${jawab}`);
        const data = await res.json();
        const hasilDiv = document.getElementById('hasil');
        hasilDiv.innerText = data.message;
        hasilDiv.style.color = data.status ? "#2ecc71" : "#e74c3c";
    }
</script>

</body>
</html>
